
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSME Mitra - Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>MSME Mitra</h1>
            <p class="subtitle">Your AI Assistant for Business Growth</p>

            <div class="tabs">
                <button id="loginTab" class="active" onclick="showLogin()">Login</button>
                <button id="registerTab" onclick="showRegister()">Register</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back!</h2>
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="registerForm" style="display:none;">
                <h2>Create Account</h2>
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="password" id="registerPassword" placeholder="Password (minimum 8 characters)" minlength="8" required>
                <button type="submit">Create Account</button>
            </form>

            <p id="authMessage"></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
