# Government health schemes that could have paid a hospital bill, for every state and UT.
#
# Used by kk/schemes.py to show a family who paid cash how much a scheme could have paid.
# Every cover amount cites a source id in sources.yaml (scheme_*). Nothing here is ever added
# to the amount a family can challenge: it is awareness, not a claim.
#
# cover:      the most the scheme pays (INR). null with kind no_ceiling.
# kind:       family_year  - per family per year (floater)
#             no_ceiling   - no money cap; treatment at the scheme's package rates
#             one_time     - one-time assistance
#             co_pay       - scheme pays `share` percent of the package rate, up to `cover`
# who:        eligibility codes, each rendered by message sav_who_<code>. Figures in `values`.
# where:      empanelled (default) | govt_super_speciality | in_state | esi | cghs
# general:    true if any family could qualify by income, residence or age alone
#             (used to pick the headline). Job-linked schemes are false.
# checked:    date the cover was last checked against the source.

checked: "2026-11-28"

central:
  - id: pmjay
    name: "Ayushman Bharat PM-JAY"
    cover: 500000
    kind: family_year
    who: [secc]
    general: true
    check_url: "https://beneficiary.nha.gov.in"
    phone: "14555"
    source: scheme_pmjay
