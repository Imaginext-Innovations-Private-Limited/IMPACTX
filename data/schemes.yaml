    check_url: "https://cghs.mohfw.gov.in"
    source: scheme_cghs
  - id: echs
    name: "Ex-Servicemen Contributory Health Scheme (ECHS)"
    cover: null
    kind: no_ceiling
    who: [ex_servicemen]
    general: false
    check_url: "https://www.echs.gov.in"
    source: scheme_echs
  - id: capf
    name: "Ayushman CAPF"
    cover: null
    kind: no_ceiling
    who: [capf]
    general: false
    source: scheme_capf
  - id: ran
    name: "Rashtriya Arogya Nidhi (RAN)"
    cover: 1500000
    kind: one_time
    who: [bpl_life_threatening]
    where: govt_super_speciality
    general: false
    check_url: "https://mohfw.gov.in/major-programmes/poor-patients-financial-assistance/rashtriya-arogya-nidhi"
    source: scheme_ran

