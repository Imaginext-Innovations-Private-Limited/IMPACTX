name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install deployment dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check browser script and Vercel entry point
        run: |
          node --check public/app.js
          node --input-type=module -e "await import('./api/jalnetra.js')"
      - name: Run automated tests
        run: npm test
      - name: Install database and browser test runtimes
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14 playwright@1.51.1
      - name: Verify community database migrations and permissions
        run: node scripts/verify-community-database.mjs
      - name: Verify organizer and restoration browser flows
        run: node scripts/verify-community-browser.mjs
