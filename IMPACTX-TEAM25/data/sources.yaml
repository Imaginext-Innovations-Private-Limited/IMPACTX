# ---------------------------------------------------------------- GST on health care (TAX-GST)
gst_circular32_2018:
  title: "CBIC Circular No. 32/06/2018-GST (12.02.2018), Sl. No. 5: GST on services by hospitals"
  publisher: "Ministry of Finance, Department of Revenue, Tax Research Unit (CBIC)"
  date: "2018-02-12"
  urls:
    - "https://gstcouncil.gov.in/sites/default/files/2024-06/circularno-32-cgst.pdf"
  rule_ref: "Sl. No. 5, clarification (1) to (3); refers to Sl. No. 74 and para 2(zg) of Notification 12/2017-CT(Rate)"
  rule_quote: >-
    "Health care services provided by a clinical establishment, an authorised medical practitioner or para-medics are exempt."
  notes: >-
    Same entry: "The entire amount charged by them from the patients including the retention money and the fee/payments
    made to the doctors etc., is towards the healthcare services provided by the hospitals to the patients and is exempt."
    Food supplied to in-patients as advised by the doctor/nutritionists is part of the composite supply of healthcare and
    not separately taxable; food for patients not admitted, attendants or visitors is taxable. Para 2(zg) of Notification
    12/2017 excludes hair transplant and cosmetic or plastic surgery, except to restore or reconstruct anatomy or
    functions affected by congenital defects, developmental abnormalities, injury or trauma; such lines are grey here.

gst_n04_2022_room:
  title: "Notification No. 04/2022-Central Tax (Rate), 13.07.2022, amending Sl. No. 74 of Notification 12/2017: hospital rooms above Rs 5000 a day"
  publisher: "Ministry of Finance, Department of Revenue (Gazette of India, Extraordinary)"
  date: "2022-07-13"
  effective: "2022-07-18"
  urls:
    - "https://gstcouncil.gov.in/sites/default/files/2024-05/04_2022-ctr-eng_1.pdf"
    - "https://rsdebate.nic.in/bitstream/123456789/730645/1/PQ_257_26072022_U1038_p262_p262.pdf"
  rule_ref: "Para 1(s): proviso inserted in Sl. No. 74, column (3), clause (a); in force from 18.07.2022"
  rule_quote: >-
    "Provided that nothing in this entry shall apply to the services provided by a clinical establishment by way of
    providing room [other than Intensive Care Unit (ICU)/Critical Care Unit (CCU)/Intensive Cardiac Care Unit
    (ICCU)/Neo natal Intensive Care Unit (NICU)] having room charges exceeding Rs. 5000 per day to a person receiving
    health care services."
  notes: >-
    Rajya Sabha answer (26.07.2022): GST will not be applicable on ICU/CCU charges irrespective of the amount; rooms up to
    Rs 5000 per day for a person remain exempt. Before 18.07.2022 every hospital room was exempt.

gst_n03_2022_room_rate:
  title: "Notification No. 03/2022-Central Tax (Rate), 13.07.2022: new entry 31A in Notification 11/2017, room charges above Rs 5000 a day"
  publisher: "Ministry of Finance, Department of Revenue (Gazette of India, Extraordinary)"
  date: "2022-07-13"
  effective: "2022-07-18"
  urls:
    - "https://gstcouncil.gov.in/sites/default/files/2024-05/03_2022-ctr-eng_1.pdf"
  rule_ref: "Entry 31A, Heading 9993: central tax 2.5% without input tax credit; with equal state tax the GST is 5%"
  notes: "47th GST Council: room rent (excluding ICU) above Rs 5000 per day per patient taxed at 5% without ITC."

# ---------------------------------------------------------------- health insurance (insurance deduction check)
irdai_mc_standardization_2020:
  title: "IRDAI Master Circular on Standardization of Health Insurance Products, IRDAI/HLT/REG/CIR/193/07/2020 (22.07.2020): lists of items not payable or subsumed"
  publisher: "Insurance Regulatory and Development Authority of India"
  date: "2020-07-22"
  urls:
    - "https://irdai.gov.in/document-detail?documentId=395035"
    - "https://taxguru.in/corporate-law/modification-guidelines-standardization-health-insurance.html"
    - "https://www.paramounttpa.com/Home/Download/Modification_Guidelines_on_Standardzation.pdf"
  rule_ref: "Annexure (from IRDAI/HLT/REG/CIR/176/09/2019, 27.09.2019): List I optional items; List II subsumed into room charges; List III into procedure charges; List IV into costs of treatment"
  rule_quote: >-
    List II "Items specified in the list shall form part of room charges"; insurers shall ensure such items are not
    billed to the policyholders by the hospitals, and make this part of the service level agreement with network hospitals.
  notes: >-
    Item lists were read from two copies of the 2019 circular (TPA copy and a full-text reproduction) and agree item for
    item. IRDAI lists the 2020 master circular as non-archived. For reimbursement claims from providers outside the
    network, claims are settled as per policy terms.

irdai_mc_health_2024:
  title: "IRDAI Master Circular on Health Insurance Business, IRDAI/HLT/CIR/PRO/84/5/2024 (29.05.2024)"
  publisher: "Insurance Regulatory and Development Authority of India"
  date: "2024-05-29"
  urls:
    - "https://mail.caalley.com/irda24/Master_Circular_on_Health_Insurance_Business_29052024.pdf"
    - "https://policyholder.gov.in/web/guest/circulars"
  rule_ref: "Chapter II para 17(b): reasons for repudiation or partial disallowance; Chapter I para 15(b), 16(a): cashless timelines"
  rule_quote: >-
    Where a claim is repudiated or partially disallowed, the "details shall be conveyed to the claimant along with full
    details giving reference to the specific terms" of the policy.
  notes: "Cashless: decide within one hour of request (15(b)); final authorisation within three hours of the discharge request (16(a))."

irdai_proportionate_2020:
  title: "IRDAI Modified Guidelines on Product Filing in Health Insurance: Norms on Proportionate Deductions (11.06.2020)"
  publisher: "Insurance Regulatory and Development Authority of India"
  date: "2020-06-11"
  urls:
    - "https://compfie.aparajitha.com/wp-content/uploads/2020/06/13062020_FCC_04.pdf"
  rule_ref: "Para 4: pharmacy and consumables, implants and medical devices, and diagnostics cannot be associate medical expenses; para 6: not where the hospital has no differential billing; para 7: not for ICU charges"
  rule_quote: >-
    "Insurers are not permitted to apply proportionate deduction for 'ICU charges' as different categories of ICU are not there."
  notes: >-
    Reference number read from a scan as IRDAI/HLT/REG/CIR/150/06/2020. Applies to products filed on or after
    01.10.2020. Whether the 2024 master circulars retain it is not confirmed here, so this is used only to suggest a
    question to the insurer, never a claimed amount.

irdai_grievance_tat:
  title: "IRDAI Policyholders' Protection and Grievance Redressal: insurer must resolve a grievance within two weeks"
  publisher: "Insurance Regulatory and Development Authority of India (policyholder.gov.in)"
  date: "2026-08-14"
  urls:
    - "https://policyholder.gov.in/web/guest/grievance-cell-cad"
    - "https://policyholder.gov.in/web/guest/functions"
  rule_ref: "Grievance cell FAQ (Regulation 4(4), Protection of Policyholders' Interests Regulations)"
  rule_quote: >-
    "An insurance company is required to resolve a grievance within two weeks of its receipt."
  notes: >-
    If not resolved in two weeks, unattended, or not resolved to satisfaction, escalate to IRDAI: Bima Bharosa portal
    https://bimabharosa.irdai.gov.in, toll free 155255 or 1800 4254 732, complaints@irdai.gov.in. Department of Financial
    Services statement of 14.08.2026 repeats the 14-day resolution time.

ombudsman_rules_2017:
  title: "Insurance Ombudsman Rules, 2017 (as amended 18.05.2021), Rule 14(3)"
  publisher: "Ministry of Finance, Department of Financial Services"
  date: "2021-05-18"
  urls:
    - "https://financialservices.gov.in/beta/sites/default/files/2025-09/The-Insurance-Ombudsman-Rules-2017%20-Last-amended-on-18.5.2021.pdf"
    - "https://www.cioins.co.in/"
  rule_ref: "Rule 14(3)(a): written representation to the insurer first, then rejection, no reply within one month, or reply not satisfactory; Rule 14(3)(b): complaint within one year"
  rule_quote: >-
    "The complaint is made within one year- (i) after the order of the insurer rejecting the representation is received"
  notes: "Filing is free; complaints are lodged with the Council for Insurance Ombudsmen (Bima Lokpal)."

