hospital_stent_lists:
  title: "Coronary stent price lists that hospitals publish under the NPPA display requirement"
  publisher: "Apollo Hospitals, Breach Candy Hospital, Fortis Healthcare, CARE Hospitals, Ruby Hall Clinic"
  date: "2026-11-27"
  urls:
    - "https://breachcandyhospital.org/stents"
    - "https://apollohospitals.com/bangalore/departments/heart/our-stents-pricing"
    - "https://www.apollohospitals.com/delhi/heart/heart-stent-prices"
    - "https://indore.apollohospitals.com/departments/cardiology/our-stents-pricing/"
    - "https://www.fortishealthcare.com/stent-pricing"
    - "https://www.carehospitals.com/assets/documents/care-hospitals-stent-pricing.pdf"
    - "https://rubyhall.com/stent-rates/"
  notes: >-
    Real brand names as hospitals write them on price lists and bills, with the hospital's own
    DES/BMS label where it gives one. Used only to recognise that a line is a coronary stent.
    A brand's type is used only when it is DES (the higher ceiling); a brand labelled BMS is still
    checked against the DES ceiling unless the line itself says bare metal, so a brand table
    can never inflate a claim.

