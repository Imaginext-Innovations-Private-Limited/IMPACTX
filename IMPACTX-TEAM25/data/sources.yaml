# Source register. Every reference row and every rule must point to an id here.
# Each entry records where the official text can be read. Keep a copy of every
# downloaded PDF in data/raw/ with its sha256 (scripts/refresh.py does this).

nppa_stent_2026:
  title: "NPPA notification revising ceiling prices of coronary stents w.e.f. 01.04.2026"
  publisher: "National Pharmaceutical Pricing Authority (Gazette of India, Extraordinary)"
  date: "2026-03-25"
  urls:
    - "https://advocategandhi.com/wp-content/uploads/2026/03/Department-of-Pharmaceuticals-–-NPPA-Order-on-Coronary-Stent-Price-Revision.pdf"
    - "https://medicaldialogues.in/news/industry/medical-devices/nppa-revises-coronary-stent-prices-des-at-rs-39186-and-bms-at-rs-10762-from-april-2026-168192"
  notes: "Ceiling prices exclusive of GST. BMS 10,762.15; DES incl. BVS/biodegradable 39,186.03."
  tax_basis: exclusive_of_gst
  tax_quote: >-
    NPPA fixes coronary stent ceiling prices "exclusive of Goods and Services Tax as applicable"
    (S.O. 1551(E), 26.03.2024; the 2026 revision is reported with the same basis), and GST may be
    added "only if they have paid actually or if it is payable to the Government" (Note (b)).
    So the most a patient can be charged is ceiling + GST. Kharcha Kavach always allows GST,
    even when the bill shows none, which can only lower a claimed excess.
  tax_quote_urls:
    - "https://medicaldialogues.in/pdf_upload/13-so1551-dt-26032024-1-237462.pdf"
    - "https://medicaldialogues.in/news/industry/medical-devices/nppa-revises-coronary-stent-prices-des-at-rs-39186-and-bms-at-rs-10762-from-april-2026-168192"

nppa_knee_2024:
  title: "S.O. 3869(E) dated 10.09.2024 - ceiling prices of orthopaedic knee implants (continued w.e.f. 16.09.2024)"
  publisher: "National Pharmaceutical Pricing Authority"
  date: "2024-09-10"
  urls:
    - "https://www.carehospitals.com/assets/documents/care-hospitals-implant-pricing.pdf"
    - "https://medicaldialogues.in/news/industry/pharma/nppa-extends-ceiling-prices-of-knee-implants-till-september-2025-134989"
  notes: "15 rows (11 primary, 4 revision). Prices exclusive of GST. Notes (b)-(t) of S.O. 2668(E) apply."
  tax_basis: exclusive_of_gst
  tax_quote: >-
    For knee implants "the ceiling price is the maximum price to the retailer (excluding taxes, if any)".
    Hospitals bill on that basis: the CARE Hospitals implant price list shows the femoral component at
    51,562.94 without GST and 54,141 with GST at 5%. Kharcha Kavach allows ceiling + GST, which can only
    lower a claimed excess.
  tax_quote_urls:
    - "https://medicaldialogues.in/news/industry/pharma/nppa-extends-ceiling-prices-of-knee-implants-till-september-2025-134989"
    - "https://www.carehospitals.com/assets/documents/care-hospitals-implant-pricing.pdf"

