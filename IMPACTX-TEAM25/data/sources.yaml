nppa_so1581_2026:
  title: "NPPA order S.O. 1581(E): revised ceiling prices of scheduled formulations w.e.f. 01.04.2026 (WPI 0.64956%)"
  publisher: "National Pharmaceutical Pricing Authority (Gazette of India, Extraordinary, No. 1516, 25.03.2026)"
  date: "2026-03-25"
  urls:
    - "https://medicaldialogues.in/pdf_upload/2026/04/02/0d883ca9b600c8a13cec452376176fc4-339037.pdf"
    - "https://medicaldialogues.in/news/industry/pharma/nppa-revises-ceiling-prices-of-138-essential-drugs-with-wpi-linked-hike-effective-april-1-167836"
    - "https://egazette.gov.in"
  notes: >-
    Gazette copy signed by Bhiva Ram Yadav, Assistant Director, NPPA. Supersedes S.O. 1487(E) of 27.03.2025
    for the listed rows. 20 rows (sodium chloride, Ringer lactate, paracetamol injection, tramadol injection,
    diclofenac capsule) were read from the Gazette copy and from the published table, and both readings agree.
    Staged in data/staged/ for a person to check against the PDF before approval.
  tax_basis: exclusive_of_gst
  tax_quote: >-
    NPPA fixes these prices "as ceiling prices exclusive of Goods and Services Tax applicable, if any"
    (S.O. 1581(E), 25.03.2026). So the most a patient can be charged is ceiling + GST. Kharcha Kavach
    always allows GST, even when the bill shows none, which can only lower a claimed excess.

