{% extends "base.html" %}

{% block title %}Server Error (500) - Welfare Scheme Navigator{% endblock %}

{% block content %}
<div class="container py-5 text-center">

    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
    <h1 class="fw-bold mt-3">Internal Service Error</h1>
    <p class="text-muted mb-4">
      An unexpected issue occurred while evaluating scheme data. Please try your request again.

    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('views.home') }}" class="btn btn-sahaaya-primary">

      </a>
      <a href="{{ url_for('views.assistant_page') }}" class="btn btn-outline-secondary">

      </a>
    </div>
  </div>
</div>
{% endblock %}
