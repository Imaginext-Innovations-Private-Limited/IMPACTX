[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aarogya-contracts"
version = "0.4.0"
description = "Shared Pydantic v2 models, JSON Schema Draft 2020-12 exports, and TypeScript interfaces for Aarogya Mesh"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aarogya_contracts"]
