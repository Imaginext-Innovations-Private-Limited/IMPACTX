[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aarogya-crdt-sync"
version = "0.4.0"
description = "Event-sourced Hybrid Logical Clock (HLC), SQLite event store, CRDT state projector, and offline peer delta-sync engine for Aarogya Mesh"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aarogya-contracts",
    "pydantic>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aarogya_crdt_sync"]
