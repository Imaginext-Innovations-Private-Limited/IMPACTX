[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aarogya-clinical-engine"
version = "0.4.0"
description = "Deterministic offline clinical safety floor for Aarogya Mesh (WHO IMNCI, NHM ASHA ANC/PNC, India UIP)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aarogya-contracts",
    "pydantic>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aarogya_clinical_engine"]
